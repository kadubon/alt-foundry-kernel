name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=alt_foundry_kernel
      - run: uv run pip-audit
      - run: uv run altk validate examples/candidate_packet.json
      - run: uv run altk validate examples/proxy_only_packet.json
      - run: uv run altk validate examples/admission_packet.json
      - run: uv run altk validate examples/deprecation_packet.json
      - run: uv run altk validate examples/transport_refresh_packet.json
      - run: uv run altk validate examples/monitor_alarm_packet.json
      - run: uv run altk validate examples/rollback_packet.json
      - run: uv run altk validate examples/resurrection_packet.json
      - run: uv run altk validate examples/bridge_packet.json
      - run: uv run altk validate examples/kernel_update_packet.json
      - run: uv run altk certify measurement examples/certificates/measurement_spec.json
      - run: uv run altk certify transport examples/certificates/transport_certificate.json
      - run: uv run altk certify risk examples/certificates/risk_ledger.json
      - run: uv run altk certify authority examples/certificates/authority_certificate.json
      - run: uv run altk certify root-finality examples/certificates/root_finality_record.json
      - run: uv run altk certify causal examples/certificates/causal_certificate.json
      - run: uv run altk certify cara examples/certificates/cara_claim.json
      - run: uv run altk certify reproduction examples/certificates/reproduction_record.json
      - run: uv run altk certify non-reduction examples/certificates/non_reduction_audit.json
      - run: uv run altk certify mechanism examples/certificates/mechanism_certificate.json
      - run: uv run altk certify evaluator examples/certificates/evaluator_hierarchy.json
      - run: uv run altk certify finality examples/certificates/finality_poua_ledger.json
      - run: uv run altk certify sequential examples/certificates/sequential_decision.json
      - run: uv run altk certify transport-ext examples/certificates/transport_robustness.json
      - run: uv run altk certify certificate-algebra examples/certificates/certificate_composition.json
      - run: uv run altk certify portfolio-ext examples/certificates/portfolio_constraints.json
      - run: uv run altk certify foundry-control examples/certificates/foundry_control_state.json
      - run: uv run altk certify cara-ext examples/certificates/cara_process.json
      - run: uv run altk estimate finite-sample examples/estimators/finite_sample.json
      - run: uv run altk estimate proxy-bridge examples/estimators/proxy_bridge.json
      - run: uv run altk estimate causal-effect examples/estimators/causal_effect.json
      - run: uv run altk estimate transport-diagnostics examples/estimators/transport_diagnostics.json
      - run: uv run altk estimate guard-risk examples/estimators/guard_risk.json
      - run: uv run altk estimate federated-pooling examples/estimators/federated_pooling.json
      - run: uv run altk estimate portfolio-selection examples/estimators/portfolio_selection.json
      - run: uv run altk estimate foundry-phase examples/estimators/foundry_phase.json
      - run: uv run altk estimate reproduction-phase examples/estimators/reproduction_phase.json
      - run: uv run altk estimate cara-time-to-target examples/estimators/cara_time_to_target.json
      - run: uv run altk estimate alpha-budget examples/estimators/alpha_budget.json
      - run: uv run altk conformance --fixtures conformance --level L5
      - run: uv run altk audit-public --strict
