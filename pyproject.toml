[project]
name = "alt-foundry-kernel"
version = "0.1.0"
description = "Agent-operable certification kernel bootloader for Abstraction Liquidity Theory executable certificate packets."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "ALT Foundry Kernel contributors" }]
keywords = [
  "abstraction-liquidity-theory",
  "abstraction-token",
  "agent-operable-foundry",
  "ai-agent-certification",
  "certification-kernel",
  "dual-ledger",
  "executable-certificate-packet",
  "json-schema",
  "safe-certified-capital",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "jsonschema>=4.22",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.urls]
Paper = "https://doi.org/10.5281/zenodo.20476200"
Homepage = "https://doi.org/10.5281/zenodo.20476200"
Repository = "https://github.com/kadubon/alt-foundry-kernel"
Issues = "https://github.com/kadubon/alt-foundry-kernel/issues"

[project.scripts]
altk = "alt_foundry_kernel.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pytest>=8.2",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alt_foundry_kernel"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "alt_foundry_kernel/schemas"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
